<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tanque</title>
  <meta name="description" content="Tanque de água 2D com física de fluido de verdade: desenhe as paredes com o mouse e jogue água.">
  <meta name="theme-color" content="#eef1f2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='26' height='24' rx='3' fill='%23eef1f2' stroke='%232a2f33' stroke-width='2.5'/%3E%3Cpath d='M4.5 18c4-2 7 2 11.5 0s7.5-2 11.5 0V26.5h-23z' fill='%232e8fa6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tanque.css">
</head>
<body>
  <canvas id="tanque" class="tanque" role="img"
    aria-label="Tanque de água visto de lado, na frente de um painel de calibração. Desenhe paredes e jogue água com as ferramentas."></canvas>
  <canvas id="guia" class="guia" aria-hidden="true"></canvas>
  <div id="regua" class="regua-numeros" aria-hidden="true"></div>

  <header class="marca">
    <h1 class="marca__nome">Tanque</h1>
    <p class="marca__linha">canal de ensaio · água incompressível em 2D</p>
  </header>

  <p class="leitura" id="leitura" aria-live="off">
    <span id="litros">0,0 L</span><span class="leitura__sep">·</span><span id="particulas">0 partículas</span><span class="leitura__sep">·</span><span id="qps">— qps</span><span class="leitura__sep">·</span><span id="motor">…</span>
  </p>

  <nav class="ferramentas" aria-label="Ferramentas">
    <p class="ferramentas__grupo">Paredes</p>
    <div class="ferramentas__lista" role="radiogroup" aria-label="Ferramenta">
      <button type="button" class="ferramenta" data-ferramenta="parede" role="radio" aria-checked="true" title="Parede: arraste para desenhar (1)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15.5c2.5-1 4-4 6.5-5s4.5 1.5 7.5-6" /></svg>
        <span class="ferramenta__nome">Parede</span><kbd>1</kbd>
      </button>
      <button type="button" class="ferramenta" data-ferramenta="reta" role="radio" aria-checked="false" title="Reta: arraste de uma ponta à outra (2)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 16.5l13-13" /><circle cx="3.5" cy="16.5" r="1.4" /><circle cx="16.5" cy="3.5" r="1.4" /></svg>
        <span class="ferramenta__nome">Reta</span><kbd>2</kbd>
      </button>
      <button type="button" class="ferramenta" data-ferramenta="borracha" role="radio" aria-checked="false" title="Borracha: apaga parede (3)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 16.5h8.5M4.2 12.3l7.6-7.6a1.8 1.8 0 0 1 2.5 0l1.9 1.9a1.8 1.8 0 0 1 0 2.5l-6.9 6.9a1.8 1.8 0 0 1-1.3.5H6.3a1.8 1.8 0 0 1-1.3-.5l-.8-.8a1.8 1.8 0 0 1 0-2.5zM8.3 8.2l4.4 4.4" /></svg>
        <span class="ferramenta__nome">Borracha</span><kbd>3</kbd>
      </button>
    </div>
    <p class="ferramentas__grupo">Água</p>
    <div class="ferramentas__lista" role="radiogroup" aria-label="Ferramenta de água">
      <button type="button" class="ferramenta" data-ferramenta="torneira" role="radio" aria-checked="false" title="Torneira: segure para despejar água (4)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5h7.5a3 3 0 0 1 3 3V11M3 4v5M13.5 13.5c0 1.3-.9 2.8-1.5 3.5-.6-.7-1.5-2.2-1.5-3.5" /></svg>
        <span class="ferramenta__nome">Torneira</span><kbd>4</kbd>
      </button>
      <button type="button" class="ferramenta" data-ferramenta="balde" role="radio" aria-checked="false" title="Balde: arraste um retângulo para soltar um bloco de água (5)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5h13v11h-13z" stroke-dasharray="2 1.6" /><path d="M3.5 11c2.2-1.2 4.3 1.2 6.5 0s4.3-1.2 6.5 0v4.5h-13z" class="cheio" /></svg>
        <span class="ferramenta__nome">Balde</span><kbd>5</kbd>
      </button>
      <button type="button" class="ferramenta" data-ferramenta="esponja" role="radio" aria-checked="false" title="Esponja: tira água (6)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="6" width="14" height="9" rx="2.2" /><circle cx="7" cy="9.5" r=".9" /><circle cx="11.5" cy="11.5" r=".9" /><circle cx="13.5" cy="8.5" r=".7" /></svg>
        <span class="ferramenta__nome">Esponja</span><kbd>6</kbd>
      </button>
      <button type="button" class="ferramenta" data-ferramenta="mao" role="radio" aria-checked="false" title="Mão: empurra a água na direção do movimento (7)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 10V4.8a1.2 1.2 0 0 1 2.4 0V9m0-.5V3.6a1.2 1.2 0 0 1 2.4 0V9m0-4.2a1.2 1.2 0 0 1 2.4 0V10m0-3a1.2 1.2 0 0 1 2.4 0v4.5c0 3.2-2.4 5.5-5.4 5.5h-.6c-2 0-3.3-.9-4.4-2.4L3.7 12a1.3 1.3 0 0 1 2-1.6L7 11.8" /></svg>
        <span class="ferramenta__nome">Mão</span><kbd>7</kbd>
      </button>
      <button type="button" class="ferramenta" data-ferramenta="corante" role="radio" aria-checked="false" title="Corante: pinta a água que já está no tanque (8)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5l3 3-7.8 7.8-3.6.6.6-3.6zM4 17.5c.8-.4 1.6-.4 2.4 0" /></svg>
        <span class="ferramenta__nome">Corante</span><kbd>8</kbd>
      </button>
    </div>

    <p class="ferramentas__grupo" id="rotulo-cor">Cor da água</p>
    <div class="cores" role="radiogroup" aria-labelledby="rotulo-cor" id="cores"></div>

    <label class="tamanho">
      <span class="ferramentas__grupo">Tamanho <kbd>[</kbd><kbd>]</kbd></span>
      <input type="range" id="tamanho" min="0" max="100" value="35">
    </label>
  </nav>

  <nav class="modelos" aria-label="Cenários prontos">
    <span class="modelos__rotulo">Montar</span>
    <div class="modelos__lista" id="modelos"></div>
  </nav>

  <div class="controles" aria-label="Controles da simulação">
    <button type="button" class="controle" id="pausar" aria-pressed="false" title="Pausar (Espaço)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5v11M13 4.5v11" /></svg><span>Pausar</span>
    </button>
    <button type="button" class="controle" id="lento" aria-pressed="false" title="Câmera lenta, ¼ da velocidade (L)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10.5" r="6.5" /><path d="M10 6.5v4l2.5 1.5M8 2.5h4" /></svg><span>Lento</span>
    </button>
    <button type="button" class="controle" id="desfazer" title="Desfazer a última parede (Ctrl+Z)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5L3.5 8.5 7 12M3.5 8.5H12a4.5 4.5 0 0 1 0 9H9" /></svg><span>Desfazer</span>
    </button>
    <button type="button" class="controle" id="limpar-agua" title="Tirar toda a água">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3s-5 5.6-5 9a5 5 0 0 0 10 0c0-3.4-5-9-5-9zM4 16L16 4" /></svg><span>Sem água</span>
    </button>
    <button type="button" class="controle" id="limpar-paredes" title="Apagar todas as paredes">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M5.5 6l.8 10.5h7.4L14.5 6" /></svg><span>Sem paredes</span>
    </button>
    <label class="controle controle--selecao" title="Resolução da simulação">
      <span>Qualidade</span>
      <select id="qualidade"></select>
    </label>
    <button type="button" class="controle" id="tela-cheia" title="Tela cheia (F)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" /></svg><span>Tela cheia</span>
    </button>
  </div>

  <p class="dica" id="dica" aria-live="polite"></p>
  <p class="aviso" id="aviso" hidden></p>

  <script type="module" src="js/principal.js"></script>
</body>
</html>
